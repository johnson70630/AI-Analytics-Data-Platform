resources:
  jobs:
    daily_generator:
      name: AI Analytics Daily Generator
      max_concurrent_runs: 1
      tasks:
        - task_key: run_daily_generator
          spark_python_task:
            python_file: ../databricks/jobs/run_daily_generator.py
            parameters:
              - --bundle-root
              - ${workspace.file_path}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - -r ${workspace.file_path}/requirements.txt
