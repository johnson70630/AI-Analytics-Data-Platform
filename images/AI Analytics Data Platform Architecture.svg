<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">AI Analytics Data Platform end-to-end workflow</title>
  <desc id="desc">Scheduled Databricks Lakeflow ingestion and dbt transformations feed read-only operational evidence. A user manually refreshes Daily Health Review or starts a bounded LangGraph investigation through the DataOps AI Command Center.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="1" stop-color="#0a1527"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7890a8"/>
    </marker>
    <style>
      .panel{fill:#0b1726;stroke-width:2}.scheduled{stroke:#22d3ee}.evidence{stroke:#64748b}.ondemand{stroke:#a78bfa}
      .box{rx:14;stroke-width:2;filter:url(#shadow)}.source{fill:#10283d;stroke:#22d3ee}.transform{fill:#172e47;stroke:#60a5fa}
      .govern{fill:#143b34;stroke:#34d399}.agent{fill:#2a204b;stroke:#a78bfa}.store{fill:#19283e;stroke:#94a3b8}
      .warning{fill:#4a3012;stroke:#fbbf24}.report{fill:#42233e;stroke:#f472b6}.health{fill:#183449;stroke:#38bdf8}
      .edge{fill:none;stroke:#7890a8;stroke-width:2.2;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}
      .title{font:700 38px Inter,system-ui,sans-serif;fill:#f0f9ff}.subtitle{font:400 19px Inter,system-ui,sans-serif;fill:#9fb3c8}
      .panel-title{font:700 22px Inter,system-ui,sans-serif;letter-spacing:1.4px}.cyan{fill:#67e8f9}.violet{fill:#c4b5fd}.slate{fill:#cbd5e1}
      .label{font:700 19px Inter,system-ui,sans-serif;fill:#f8fafc;text-anchor:middle}.detail{font:400 15px Inter,system-ui,sans-serif;fill:#cbd5e1;text-anchor:middle}
      .small{font:500 13px Inter,system-ui,sans-serif;fill:#cbd5e1;text-anchor:middle}.edge-label{font:600 13px Inter,system-ui,sans-serif;fill:#a7f3d0}
      .legend{font:600 14px Inter,system-ui,sans-serif;fill:#dbeafe}.pill{rx:11;stroke-width:1.5}
    </style>
  </defs>

  <rect width="2400" height="1350" fill="url(#bg)"/>
  <text x="60" y="62" class="title">AI Analytics Data Platform</text>
  <text x="60" y="96" class="subtitle">Scheduled medallion pipeline → governed evidence → user-triggered DataOps investigation</text>
  <rect x="1770" y="38" width="16" height="16" class="pill source"/><text x="1798" y="52" class="legend">Scheduled data path</text>
  <rect x="1995" y="38" width="16" height="16" class="pill agent"/><text x="2023" y="52" class="legend">On-demand path</text>
  <rect x="2190" y="38" width="16" height="16" class="pill warning"/><text x="2218" y="52" class="legend">Evidence boundary</text>

  <!-- Scheduled data platform -->
  <rect x="40" y="130" width="1010" height="1130" rx="22" class="panel scheduled"/>
  <text x="75" y="177" class="panel-title cyan">1 · DAILY DATA PLATFORM — SCHEDULED</text>

  <rect x="80" y="220" width="270" height="100" class="box source"/>
  <text x="215" y="260" class="label">Synthetic events</text><text x="215" y="288" class="detail">product · model · finance</text>
  <rect x="390" y="220" width="270" height="100" class="box source"/>
  <text x="525" y="260" class="label">Lakeflow Jobs</text><text x="525" y="288" class="detail">daily orchestration</text>
  <rect x="700" y="210" width="310" height="120" class="box source"/>
  <text x="855" y="250" class="label">Python / Spark generator</text><text x="855" y="278" class="detail">deterministic source state</text><text x="855" y="301" class="small">clean state separated from dirty Bronze</text>
  <path d="M350 270 H390" class="edge"/><path d="M660 270 H700" class="edge"/>

  <text x="525" y="375" class="small">dbt-databricks transformations + tests</text>
  <rect x="80" y="410" width="205" height="100" class="box transform"/>
  <text x="182" y="450" class="label">Delta Bronze</text><text x="182" y="478" class="detail">append-only records</text>
  <rect x="320" y="410" width="205" height="100" class="box transform"/>
  <text x="422" y="450" class="label">Staging</text><text x="422" y="478" class="detail">typed · deduplicated</text>
  <rect x="560" y="410" width="205" height="100" class="box transform"/>
  <text x="662" y="450" class="label">Silver</text><text x="662" y="478" class="detail">SCD2 · dimensions · facts</text>
  <rect x="800" y="410" width="205" height="100" class="box transform"/>
  <text x="902" y="450" class="label">Gold</text><text x="902" y="478" class="detail">business marts</text>
  <path d="M855 330 V365 H182 V410" class="edge"/><path d="M285 460 H320" class="edge"/><path d="M525 460 H560" class="edge"/><path d="M765 460 H800" class="edge"/>

  <rect x="165" y="590" width="300" height="110" class="box govern"/>
  <text x="315" y="633" class="label">Databricks AI/BI</text><text x="315" y="662" class="detail">governed Gold dashboards</text>
  <rect x="545" y="570" width="390" height="150" class="box govern"/>
  <text x="740" y="613" class="label">Observability as data</text><text x="740" y="644" class="detail">freshness · volume · quality</text><text x="740" y="672" class="detail">cross-layer reconciliation</text>
  <path d="M902 510 V545 H315 V590" class="edge"/><path d="M422 510 V540 H740 V570" class="edge"/><path d="M662 510 V545 H740 V570" class="edge"/><path d="M902 510 V550 H740 V570" class="edge"/>

  <rect x="80" y="805" width="870" height="150" class="box govern"/>
  <text x="515" y="850" class="label">Unity Catalog governance</text>
  <text x="515" y="883" class="detail">source · Bronze · staging · PII · snapshots · Silver · Gold · observability</text>
  <text x="515" y="913" class="detail">schema boundaries · least-privilege access · sensitive user isolation</text>
  <path d="M515 805 V750 H182 V510" class="edge dash"/>
  <rect x="80" y="1015" width="870" height="125" class="box store"/>
  <text x="515" y="1058" class="label">Scheduled responsibility</text>
  <text x="515" y="1088" class="detail">Lakeflow advances the synthetic logical day and executes dbt stages/tests.</text>
  <text x="515" y="1115" class="detail">No scheduled agent investigation, email notification, or automatic repair.</text>

  <!-- Evidence plane -->
  <rect x="1080" y="130" width="500" height="1130" rx="22" class="panel evidence"/>
  <text x="1115" y="177" class="panel-title slate">2 · READ-ONLY EVIDENCE</text>
  <rect x="1120" y="240" width="420" height="115" class="box store"/>
  <text x="1330" y="283" class="label">Jobs API</text><text x="1330" y="313" class="detail">latest execution and task metadata</text>
  <rect x="1120" y="400" width="420" height="130" class="box store"/>
  <text x="1330" y="443" class="label">Fixed observability SQL</text><text x="1330" y="473" class="detail">latest freshness · volume · quality</text><text x="1330" y="500" class="detail">and reconciliation checks</text>
  <path d="M660 270 H1060 V298 H1120" class="edge"/><path d="M935 645 H1060 V465 H1120" class="edge"/>

  <rect x="1120" y="600" width="420" height="150" class="box health"/>
  <text x="1330" y="645" class="label">Daily Health Review</text><text x="1330" y="677" class="detail">Manual Refresh</text><text x="1330" y="706" class="small">no automatic LLM or Genie execution</text>
  <path d="M1330 355 V600" class="edge"/><path d="M1330 530 V600" class="edge"/>
  <rect x="1120" y="820" width="420" height="175" class="box warning"/>
  <text x="1330" y="866" class="label">Association remains UNVERIFIED</text>
  <text x="1330" y="899" class="detail">Execution metadata and monitoring</text><text x="1330" y="927" class="detail">have no authoritative shared run key.</text>
  <text x="1330" y="960" class="small">Successful execution ≠ every health check passed</text>

  <!-- On-demand DataOps -->
  <rect x="1610" y="130" width="750" height="1130" rx="22" class="panel ondemand"/>
  <text x="1645" y="177" class="panel-title violet">3 · DATAOPS EXPERIENCE — USER TRIGGERED</text>
  <rect x="1650" y="220" width="150" height="80" class="box agent"/>
  <text x="1725" y="269" class="label">User</text>
  <rect x="1840" y="210" width="260" height="100" class="box agent"/>
  <text x="1970" y="251" class="label">DataOps AI</text><text x="1970" y="279" class="detail">Command Center</text>
  <path d="M1800 260 H1840" class="edge"/>

  <rect x="1650" y="370" width="230" height="105" class="box agent"/>
  <text x="1765" y="411" class="label">GPT OSS 120B</text><text x="1765" y="440" class="detail">declared model service</text>
  <rect x="1930" y="350" width="380" height="150" class="box agent"/>
  <text x="2120" y="385" class="label">Four read-only tools</text>
  <text x="2120" y="414" class="small">get_latest_pipeline_run · get_latest_observability_summary</text>
  <text x="2120" y="440" class="small">ask_genie_observability</text><text x="2120" y="465" class="small">generate_dataops_investigation_report</text>
  <path d="M1970 310 V340 H1765 V370" class="edge"/><path d="M1880 422 H1930" class="edge"/>

  <rect x="1650" y="565" width="300" height="105" class="box agent"/>
  <text x="1800" y="607" class="label">Run Full Investigation</text><text x="1800" y="638" class="detail">one explicit user action</text>
  <rect x="1990" y="555" width="320" height="125" class="box agent"/>
  <text x="2150" y="599" class="label">LangGraph workflow</text><text x="2150" y="630" class="detail">parallel evidence collection</text><text x="2150" y="655" class="small">fixed composite action</text>
  <path d="M1970 310 V535 H1800 V565" class="edge"/><path d="M1950 617 H1990" class="edge"/><path d="M1540 298 H1590 V617 H1990" class="edge"/><path d="M1540 465 H1580 V642 H1990" class="edge"/>

  <rect x="1650" y="755" width="230" height="105" class="box agent"/>
  <text x="1765" y="797" class="label">Databricks Genie</text><text x="1765" y="828" class="detail">0–2 bounded queries</text>
  <rect x="1920" y="740" width="390" height="135" class="box agent"/>
  <text x="2115" y="783" class="label">P0–P3 recommendations</text><text x="2115" y="814" class="detail">deterministic · evidence linked</text><text x="2115" y="842" class="small">proposed corrections remain advisory</text>
  <path d="M2150 680 V710 H1765 V755" class="edge"/><path d="M1880 807 H1920" class="edge"/><path d="M2150 680 V740" class="edge"/>

  <rect x="1650" y="940" width="300" height="115" class="box report"/>
  <text x="1800" y="982" class="label">InvestigationReport v1.1</text><text x="1800" y="1013" class="detail">unknowns + approval labels preserved</text>
  <rect x="1990" y="940" width="320" height="115" class="box agent"/>
  <text x="2150" y="982" class="label">Evidence-rich viewer</text><text x="2150" y="1013" class="detail">issues · Genie evidence · verification</text>
  <path d="M2115 875 V910 H1800 V940" class="edge"/><path d="M1950 997 H1990" class="edge"/>

  <rect x="1650" y="1120" width="195" height="85" class="box store"/>
  <text x="1747" y="1154" class="label">Session Store</text><text x="1747" y="1180" class="small">conversation state</text>
  <rect x="1865" y="1120" width="195" height="85" class="box store"/>
  <text x="1962" y="1154" class="label">Runtime Store</text><text x="1962" y="1180" class="small">invocation recovery</text>
  <rect x="2080" y="1120" width="230" height="85" class="box store"/>
  <text x="2195" y="1154" class="label">Agent Bricks + MLflow</text><text x="2195" y="1180" class="small">runtime · trace metadata</text>
  <path d="M1747 1120 V1085 H1970 V310" class="edge dash"/><path d="M1962 1120 V1085 H1970 V310" class="edge dash"/>

  <text x="60" y="1310" class="subtitle">Conceptual workflow — application screenshots are captured separately. MLflow span-upload limitation is documented outside this diagram.</text>
</svg>
