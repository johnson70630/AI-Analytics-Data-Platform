command: ["uv", "run", "start-server"]
env:
  - name: DATABRICKS_PIPELINE_JOB_ID
    value: "807892462186478"
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    value: "08401a2b34023edc"
  - name: DATABRICKS_GENIE_AGENT_ID
    value: "01f1d0cfc8691413ad422631b434bdbb"
# databricks apps listen by default on port 8000
#
# Agent Bricks injects the deployed Runtime Store endpoint. The LangGraph checkpointer remains
# in-process unless a managed Session Store is bound. Tracing is bound with `agentbricks tracing bind
# --experiment-name <path>` (agentbricks deploy then wires the env below; `agentbricks dev` traces to a local
# MLflow server). To set a deployment's tracing env by hand instead:
#
# env:
#   # Tracing (set a destination + an experiment). Destination: MLFLOW_TRACKING_URI or
#   # MLFLOW_TRACING_DESTINATION. Experiment: MLFLOW_EXPERIMENT_ID or MLFLOW_EXPERIMENT_NAME.
#   - name: MLFLOW_TRACKING_URI
#     value: "databricks"
#   - name: MLFLOW_EXPERIMENT_ID
#     value: "<experiment-id>"
