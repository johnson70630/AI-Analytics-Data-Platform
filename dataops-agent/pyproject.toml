[project]
name = "agent-langgraph"
version = "0.1.0"
description = "Read-only DataOps LangGraph agent for the AI Analytics Data Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent Bricks includes the HTTP runtime; this extra adds the langgraph framework adapter.
    "databricks-agentbricks[langgraph]>=0.7.0",
    "databricks-langchain==0.21.0",
    "mcp<2",  # langchain-mcp-adapters 0.3.x uses the MCP 1.x API.
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.124.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]


[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.38",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"


