version: 2

sources:
  - name: bronze
    database: "{{ 'ai_analytics' if target.type == 'databricks' else target.database }}"
    schema: "{{ 'bronze' if target.type == 'databricks' else 'landing' }}"
    description: >
      Bronze inputs for the Silver cleaning pipeline. PostgreSQL V1 reads
      landing tables, while Databricks V2 reads managed Delta Bronze tables.
      Selected entities contain controlled data-quality issues.

    tables:
      - name: models
      - name: devices
      - name: subscription_plans
      - name: users
      - name: user_updates
      - name: conversations
      - name: messages
      - name: completions
      - name: model_inferences
      - name: feedback
      - name: errors
      - name: subscriptions
      - name: purchases
      - name: payments
