version: 2

sources:
  - name: bronze
    schema: landing
    description: >
      PostgreSQL landing tables loaded from the 14 S3 Bronze source entities.
      Selected entities contain controlled data-quality issues used by the
      Silver cleaning pipeline.

    tables:
      - name: models
      - name: devices
      - name: subscription_plans
      - name: users
      - name: user_updates
      - name: conversations
      - name: messages
      - name: completions
      - name: model_inferences
      - name: feedback
      - name: errors
      - name: subscriptions
      - name: purchases
      - name: payments
